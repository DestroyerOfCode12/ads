  if (f < S.s2[0]) {   // over the shoulder of the one who keeps refreshing: spinner, tapping hand, cold coffee
    const t = sm(seg(f, 75, 150)), rs = refresher.desk.localToWorld(V(0, 0.9, -0.12));
    return [V(-7.18, 1.36, 3.95).lerp(V(-7.24, 1.3, 3.72), t), rs.clone().lerp(rs.clone().add(V(0.02, 0, 0)), t), 40]; }
  // shot 2: slide across the room to the calm owner by the window
  if (f < S.s3[0]) {
    const t1 = sm(seg(f, 150, 210)), t2 = sm(seg(f, 210, 300));
    // slide across the room, then settle on a front three quarter view of the owner, sun from the window
    const p = V(-6.5, 1.75, 5.4).lerp(V(7.2, 1.62, -0.9), t1).lerp(V(7.75, 1.52, -0.45), t2);
    const lk = V(-7.0, 1.0, 2.0).lerp(V(9.3, 1.08, 1.45), sm(seg(f, 150, 212)));
    return [p, lk, 40];
  }
  // shot 3: push in over the owner's shoulder until the inbox fills the frame
  // shot 3: an insert of the laptop screen, slow push as the emails keep arriving
  const sp = scrPos(), t = sm(seg(f, 300, 450));
  const n = new THREE.Vector3(0, 0, 1).applyQuaternion(warmLap.scr.getWorldQuaternion(new THREE.Quaternion()));
  return [sp.clone().addScaledVector(n, lerp(1.32, 1.2, t)).add(V(0.0, 0.05, 0)), sp.clone().add(V(0, -0.005, 0)), 36];
}

// ---------- per frame
function update(f) {
  drawFrozen(f); drawInbox(f); drawPhone(f);
  // everyone idles, shoulders rise and fall; the refresher taps again and again
  people.forEach((p, i) => {
    const br = Math.sin(f * 0.06 + i) * 0.01; p.torso.position.y = 0.93 + br;
    p.neckHead.rotation.x = 0.18 + Math.sin(f * 0.03 + i * 2) * 0.03; p.neckHead.rotation.z = Math.sin(f * 0.02 + i) * 0.04;
    p.arms.forEach((a, k) => { a.sh.rotation.x = -0.55 + Math.sin(f * 0.04 + i + k) * 0.02; a.el.rotation.x = -1.0; });
  });
  const tap = Math.max(0, Math.sin(f * 0.55)) ** 3; refresher.arms[1].el.rotation.x = -1.0 - tap * 0.25; refresher.arms[1].sh.rotation.x = -0.6 - tap * 0.06;
  refresher.neckHead.rotation.x = 0.1 + tap * 0.04;
  // the coffee goes cold: steam fades away during shot 1
  steam.forEach((s, i) => { const t = ((f * 0.012 + i / 10) % 1); s.position.set(Math.sin(t * 9 + i) * 0.02, 0.06 + t * 0.22, Math.cos(t * 7 + i) * 0.02); s.material.opacity = 0.32 * Math.sin(t * Math.PI) * (1 - sm(seg(f, 20, 120))); s.scale.setScalar(1 + t * 2.5); });
  // the owner: phone pings, sips coffee, smiles (a small nod), replies
  owner.g.visible = f < S.s3[0];
  const o = owner;
  o.torso.position.y = 0.93 + Math.sin(f * 0.05) * 0.008;
  const lift = sm(seg(f, 214, 236)) * (1 - sm(seg(f, 252, 272)));
  const R = o.arms[1], L = o.arms[0];
  R.sh.rotation.x = lerp(-0.55, -1.25, lift); R.sh.rotation.z = lerp(0, 0.25, lift); R.el.rotation.x = lerp(-1.0, -2.1, lift);
  o.neckHead.rotation.x = lerp(0.12, -0.12, lift) + (f > 274 ? -0.06 * Math.sin(seg(f, 274, 290) * Math.PI) : 0);
  o.neckHead.rotation.z = 0.08 * Math.sin(seg(f, 238, 262) * Math.PI);      // a content little tilt
  const reply = Math.max(0, Math.sin((f - 280) * 0.7)) ** 2 * (f > 280 && f < 300 ? 1 : 0);
  L.el.rotation.x = -1.0 - reply * 0.15; L.sh.rotation.x = -0.58;
  // mug follows the right hand while lifted, rests on the desk otherwise
  const rest = warmDesk.localToWorld(V(0.32, 0.82, 0.22)); const hand = R.hand.getWorldPosition(new THREE.Vector3());
  warmMug.position.copy(rest.lerp(hand.add(V(0.02, 0.02, -0.02)), sm(seg(f, 212, 222)) * (1 - sm(seg(f, 262, 272)))));
  wsteam.forEach((s, i) => { const t = ((f * 0.012 + i / 10) % 1); s.position.set(Math.sin(t * 9 + i) * 0.02, 0.06 + t * 0.22, Math.cos(t * 7 + i) * 0.02); s.material.opacity = 0.35 * Math.sin(t * Math.PI); s.scale.setScalar(1 + t * 2.5); });
  phoneScr.material.color.setScalar(1);
  warmFill.intensity = lerp(0, 14, sm(seg(f, 160, 230)));
  const [p, lk, fov] = camAt(f); cam.position.copy(p); cam.lookAt(lk); cam.fov = fov; cam.updateProjectionMatrix();
  // colour grade: muted grey blue and tense, then warm and vibrant
  const w = sm(seg(f, 165, 235));
  renderer.domElement.style.filter = `saturate(${lerp(0.35, 1.12, w)}) contrast(${lerp(0.94, 1.04, w)}) brightness(${lerp(0.9, 1.04, w)})`;
  const g = document.getElementById('grade');
  g.style.background = `linear-gradient(180deg, rgba(${Math.round(lerp(70, 255, w))},${Math.round(lerp(92, 196, w))},${Math.round(lerp(118, 130, w))},${lerp(0.22, 0.10, w)}), rgba(${Math.round(lerp(40, 255, w))},${Math.round(lerp(55, 170, w))},${Math.round(lerp(70, 90, w))},${lerp(0.25, 0.06, w)}))`;
  g.style.mixBlendMode = w < 0.5 ? 'multiply' : 'soft-light';
  // on screen text
  const word = (id, a, b, hold) => { const el = document.getElementById(id); const p = eQ(seg(f, a, a + 18)); el.firstElementChild.style.transform = `translateY(${(1 - p) * 135}%)`; const x = sm(seg(f, b - 10, b)); el.style.opacity = 1 - x; el.style.filter = `blur(${x * 6}px)`; el.style.display = f >= a - 1 && f < b ? 'block' : 'none'; };
  word('T1', 18, 146); word('T1b', 26, 146); word('T2a', 176, 296); word('T2b', 184, 296);
  word('T3a', 336, 446); word('T3b', 352, 446); word('T3c', 368, 446);
  document.getElementById('band').style.opacity = 0.85 * sm(seg(f, 4, 20)) * (1 - sm(seg(f, 440, 452)));
  // end card
  const e = sm(seg(f, S.end, S.end + 18)); document.getElementById('end').style.opacity = e;
  // logo: the outline draws itself, then fills (stroke draw reveal)
  const lw = document.getElementById('lw'); lw.setAttribute('stroke-dashoffset', 1400 * (1 - sm(seg(f, S.end + 6, S.end + 34))));
  lw.setAttribute('fill-opacity', sm(seg(f, S.end + 26, S.end + 40))); lw.setAttribute('stroke-opacity', 1 - 0.6 * sm(seg(f, S.end + 34, S.end + 46)));
  const lg = document.getElementById('logo'); [...lg.children].slice(1).forEach(el => { el.style.opacity = sm(seg(f, S.end + 30, S.end + 42)); });
  document.getElementById('glow').style.transform = `scale(${0.9 + 0.1 * sm(seg(f, S.end, S.end + 60))})`;
  [['e1', S.end + 24], ['e2', S.end + 32], ['e3', S.end + 52]].forEach(([id, a]) => { const el = document.getElementById(id); el.style.opacity = sm(seg(f, a, a + 10)); el.style.transform = `translateY(${(1 - eQ(seg(f, a, a + 14))) * 20}px)`; });
  const c = document.getElementById('cta'), cp = eQ(seg(f, S.end + 42, S.end + 58)); c.style.opacity = sm(seg(f, S.end + 42, S.end + 50)); c.style.transform = `scale(${0.9 + 0.1 * cp})`;
  document.getElementById('sheen').style.left = `${lerp(-140, 470, sm(seg(f, S.end + 62, S.end + 82)))}px`;     // one sheen sweep, then still
  // notification pop when the owner's phone pings
  const tp = eQ(seg(f, 200, 214)), tx = sm(seg(f, 262, 276)), toast = document.getElementById('toast');
  toast.style.opacity = sm(seg(f, 200, 208)) * (1 - tx); toast.style.transform = `translateY(${(1 - tp) * 60 + tx * 30}px) scale(${0.96 + 0.04 * tp})`;
  // highlight swipe under "offline today."
  const u = eQ(seg(f, 196, 214)) * (1 - sm(seg(f, 286, 296))); document.getElementById('ul').style.width = `${u * 540}px`;
}
window.renderFrame = f => { update(f); renderer.render(scene, cam); return true; };
window.ready = true;
if (!location.search.includes('render')) { const t0 = performance.now(); const loop = () => { window.renderFrame(((performance.now() - t0) / 1000 * 30) % N); requestAnimationFrame(loop); }; loop(); }
</script></body></html>
