<!doctype html><html><head><meta charset="utf-8"><style>
:root{--teal:#115E67;--warm:#F7F5F0;--mist:#D9ECEC;--ink:#18282A;--apricot:#F2B66D}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:390px;height:844px;overflow:hidden;background:var(--warm);font-family:"DejaVu Sans",sans-serif}
.status{height:44px;background:#fff}
.nav{height:58px;background:#fff;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #e7e3da}
.logo b{display:block;font-weight:700;font-size:19px;color:var(--teal)}.logo span{font-size:9px;letter-spacing:2px;color:var(--ink)}
.burg{margin-left:auto;width:24px;height:16px;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);position:relative}
.burg:after{content:"";position:absolute;left:0;right:0;top:3.5px;height:3px;background:var(--ink)}
.hero{margin:18px 16px 0;border-radius:18px;background:var(--teal);padding:40px 24px;height:300px;position:relative;overflow:hidden}
.hero h1{color:var(--warm);font-size:38px;line-height:1.12;font-weight:700}
.hero i{display:block;height:9px;border-radius:5px;background:rgba(247,245,240,.35);margin-top:14px}
.hero em{display:block;width:130px;height:40px;border-radius:20px;background:var(--apricot);margin-top:22px}
.hero .b{position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;background:rgba(217,236,236,.14)}
.blk{margin:16px;height:170px;background:#fff;border-radius:16px;padding:16px;display:flex;gap:14px}
.blk .img{width:42%;border-radius:10px;background:linear-gradient(135deg,var(--mist),#b9d8d9)}
.blk .tx{flex:1}.blk .tx i{display:block;height:9px;border-radius:5px;background:#dfe5e4;margin:8px 0 12px}
.blk .tx i.h{height:14px;background:var(--teal);opacity:.85;width:70%}
</style></head><body>
<div class="status"></div>
<div class="nav"><div class="logo"><b>Nimble Tech</b><span>SOLUTIONS</span></div><div class="burg"></div></div>
<div class="hero"><div class="b"></div><h1>Your business, online</h1><i style="width:80%"></i><i style="width:60%"></i><em></em></div>
<div class="blk"><div class="img"></div><div class="tx"><i class="h"></i><i></i><i style="width:80%"></i></div></div>
<div class="blk"><div class="img" style="background:linear-gradient(135deg,#f6dcb3,#F2B66D)"></div><div class="tx"><i class="h"></i><i></i><i style="width:70%"></i></div></div>
</body></html>
