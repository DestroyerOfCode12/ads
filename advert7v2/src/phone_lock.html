<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:390px;height:844px;overflow:hidden;background:#000;font-family:Inter,sans-serif}
#wall{position:absolute;inset:0;background:radial-gradient(120% 70% at 30% 20%,#2f7f87 0%,#115E67 45%,#0b3a40 100%);opacity:0}
#time{position:absolute;top:118px;width:100%;text-align:center;color:#F7F5F0;font-weight:300;font-size:92px;letter-spacing:-2px}
#date{position:absolute;top:96px;width:100%;text-align:center;color:rgba(247,245,240,.85);font-weight:500;font-size:19px}
#card{position:absolute;left:14px;right:14px;top:300px;border-radius:24px;background:rgba(247,245,240,.94);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#ic{width:46px;height:46px;border-radius:12px;background:#115E67;flex:none;position:relative}
#ic:before{content:"";position:absolute;inset:11px;border:3px solid #F2B66D;border-radius:50%}
#ic:after{content:"";position:absolute;left:21.5px;top:11px;width:3px;height:24px;background:#F2B66D;border-radius:2px}
#nt{font-weight:700;font-size:21px;color:#18282A;display:block}
#nb{font-size:19px;line-height:1.3;color:#3b4a4c;display:block;margin-top:4px}
.when{margin-left:auto;font-size:14px;color:#6b7a7c;white-space:nowrap}
#bar{position:absolute;bottom:10px;left:50%;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:rgba(247,245,240,.8)}
</style></head><body>
<div id="wall"></div>
<div id="ui" style="opacity:0"><div id="time">7:02</div>
<div id="card"><div id="ic"></div><div style="flex:1"><span id="nt">Website enquiry</span><span id="nb">New message from your contact form</span></div><span class="when">now</span></div>
<div id="bar"></div></div>
<script>
const e=t=>1-Math.pow(1-Math.max(0,Math.min(1,t)),3);
window.setState=s=>{document.getElementById('wall').style.opacity=s.wake;document.getElementById('ui').style.opacity=s.wake;
const c=document.getElementById('card');c.style.opacity=e(s.note*1.4);c.style.transform=`translateY(${(1-e(s.note))*-60}px) scale(${0.94+0.06*e(s.note)})`;};
setState({wake:0,note:0});
</script></body></html>
