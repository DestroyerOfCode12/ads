window.renderFrame = f => { update(f); composer.render(); return true; };
// projected corners of the sign's text area (for the safe zone check)
window.signBox = f => { update(f); const v = [[-1.15, -1.5], [1.15, -1.5], [1.15, 1.5], [-1.15, 1.5]].map(([x, y]) => { const p = new THREE.Vector3(x, y, 0); signInner.localToWorld(p); p.project(cam); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H, p.z]; }); return v; };
window.ready = true;
if (!location.search.includes('render')) { let t0 = performance.now(); const loop = () => { const f = ((performance.now() - t0) / 1000 * FPS) % 480; window.renderFrame(f); requestAnimationFrame(loop); }; loop(); }
